<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Shiny Text</title>

<style>
.shine {
  font-family: 'Arial Black', sans-serif;
  font-size: 80px;
  letter-spacing: 4px;
  text-transform: uppercase;
  position: relative;
  color: #fff;
  margin: 50px;
}

.shine::after {
  content: "";
  position: absolute;
  top: 0;
  left: -150%;
  width: 50%;
  height: 100%;
  background: linear-gradient(
    120deg,
    transparent 0%,
    rgba(255,255,255,0.8) 50%,
    transparent 100%
  );
  animation: shine 2s infinite;
}

@keyframes shine {
  0% { left: -150%; }
  100% { left: 150%; }
}
</style>

</head>
<body>

<h1 class="shine">YOUR TEXT HERE</h1>

</body>
</html>
