<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Grid Racing</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #debug {
      position: absolute;
      top: 10px;
      left: 10px;
      color: red;
      font-size: 20px;
      z-index: 9999;
      background: rgba(0,0,0,0.5);
      padding: 5px 10px;
      border-radius: 4px;
    }
  </style>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
</head>

<body>
  <canvas id="renderCanvas"></canvas>
  <div id="debug">Loading…</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
